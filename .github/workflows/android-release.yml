name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/audit-agent-frontend/**'
      - 'mobile/**'
      - 'scripts/generate-release-metadata.mjs'
      - 'version.json'
      - '.github/workflows/android-release.yml'
      - 'docs/mobile-deployment.md'

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  internal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      ANDROID_KEYSTORE_PATH: release-upload.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/audit-agent-frontend/package-lock.json
            mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/audit-agent-frontend

      - name: Install mobile dependencies
        run: npm ci

      - name: Compute Android version code
        run: echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"

      - name: Generate release metadata
        env:
          RELEASE_PLATFORM: android
          RELEASE_BUILD: ${{ github.run_number }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_OUTPUT: build/android-release.json
        run: node ../scripts/generate-release-metadata.mjs

      - name: Restore Android signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-upload.jks

      - name: Build web bundle
        env:
          SKIP_SITEMAP_PING: "1"
        run: npm --prefix ../apps/audit-agent-frontend run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build release AAB
        run: ./gradlew bundleRelease
        working-directory: mobile/android

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Upload release metadata artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-metadata
          path: mobile/build/android-release.json
          if-no-files-found: error

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GPLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.sudoprogrammer.plancraftai
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
