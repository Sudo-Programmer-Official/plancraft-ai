name: Deploy Microservices to App Runner

on:
  workflow_dispatch:
  push:
    branches: [ deploy ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_PAGER: ""                              # cleaner aws-cli output
      AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: posting-service
            path: services/posting-service
            ecr_repo: posting-service
            arn_secret: POSTING_SERVICE_ARN
          - name: creator-service
            path: services/creator-service
            ecr_repo: creator-service
            arn_secret: CREATOR_SERVICE_ARN
          - name: goals-service
            path: services/goals-service
            ecr_repo: goals-service
            arn_secret: GOALS_SERVICE_ARN
          - name: ai-nlp-service
            path: services/ai-nlp-service
            ecr_repo: ai-nlp-service
            arn_secret: AI_NLP_SERVICE_ARN
          - name: growth-service
            path: services/growth-service
            ecr_repo: growth-service
            arn_secret: GROWTH_SERVICE_ARN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Who am I (diagnostic)
        run: |
          set -e
          echo "Region: ${AWS_REGION}"
          aws --version
          echo "Caller identity:"
          aws sts get-caller-identity
          echo "Listing ECR repos (first 5):"
          aws ecr describe-repositories --max-items 5 || true

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image repo (from login registry)
        id: img
        run: |
          echo "repo=${{ steps.login-ecr.outputs.registry }}/${{ matrix.ecr_repo }}" >> "$GITHUB_OUTPUT"

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${{ matrix.ecr_repo }}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${{ matrix.ecr_repo }}" >/dev/null

      - name: Verify build context exists
        run: |
          set -e
          test -d "${{ matrix.path }}" || { echo "Missing directory: ${{ matrix.path }}"; exit 1; }
          if [ ! -f "${{ matrix.path }}/Dockerfile" ]; then
            echo "Missing Dockerfile at: ${{ matrix.path }}/Dockerfile"
            exit 1
          fi

      - name: Set tags
        id: tags
        run: |
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pull cache (best effort)
        continue-on-error: true
        run: |
          docker pull "${{ steps.img.outputs.repo }}:cache" || true

      - name: Build image
        run: |
          docker build \
            --cache-from "${{ steps.img.outputs.repo }}:cache" \
            -t "${{ steps.img.outputs.repo }}:latest" \
            -t "${{ steps.img.outputs.repo }}:${{ steps.tags.outputs.sha_tag }}" \
            ${{ matrix.path }}

      - name: Push image
        run: |
          docker push "${{ steps.img.outputs.repo }}:latest"
          docker push "${{ steps.img.outputs.repo }}:${{ steps.tags.outputs.sha_tag }}"

      - name: Push cache tag (optional)
        continue-on-error: true
        run: |
          docker tag "${{ steps.img.outputs.repo }}:latest" "${{ steps.img.outputs.repo }}:cache"
          docker push "${{ steps.img.outputs.repo }}:cache" || true

      - name: Update App Runner service (image + env sync)
        continue-on-error: true
        shell: bash
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LOGGING_LEVEL: ${{ secrets.LOGGING_LEVEL || 'info' }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_MONTHLY_PRICE_ID: ${{ secrets.STRIPE_MONTHLY_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_SUCCESS_URL: ${{ secrets.STRIPE_SUCCESS_URL }}
          STRIPE_CANCEL_URL: ${{ secrets.STRIPE_CANCEL_URL }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: ${{ secrets.SENDGRID_FROM_EMAIL }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          TWILIO_MAX_CALLS_PER_DAY: ${{ secrets.TWILIO_MAX_CALLS_PER_DAY }}
          TWILIO_DUPLICATE_WINDOW_MIN: ${{ secrets.TWILIO_DUPLICATE_WINDOW_MIN }}
          META_WHATSAPP_BUSINESS_ID: ${{ secrets.META_WHATSAPP_BUSINESS_ID }}
          META_WHATSAPP_PHONE_ID: ${{ secrets.META_WHATSAPP_PHONE_ID }}
          META_WHATSAPP_TOKEN: ${{ secrets.META_WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          NEEDS_OPENAI: ${{ matrix.needs_openai }}
        run: |
          SERVICE_ARN="${{ secrets[matrix.arn_secret] }}"
          if [ -z "$SERVICE_ARN" ]; then
            echo "Skipping: secret ${{ matrix.arn_secret }} not set."
            exit 0
          fi
          python - "$SERVICE_ARN" "${{ steps.img.outputs.repo }}" "$NEEDS_OPENAI" <<'PY'
          import json, os, sys
          service_arn, repo, needs_openai = sys.argv[1:]
          envs = [
            {"Name":"NODE_ENV","Value":"production"},
            {"Name":"FIREBASE_PROJECT_ID","Value":os.environ.get("FIREBASE_PROJECT_ID","")},
            {"Name":"FIREBASE_CLIENT_EMAIL","Value":os.environ.get("FIREBASE_CLIENT_EMAIL","")},
            {"Name":"FIREBASE_PRIVATE_KEY","Value":os.environ.get("FIREBASE_PRIVATE_KEY","")},
          ]
          if needs_openai == "true":
            if os.environ.get("OPENAI_API_KEY"):
              envs.append({"Name":"OPENAI_API_KEY","Value":os.environ.get("OPENAI_API_KEY")})
            envs.append({"Name":"LOGGING_LEVEL","Value":os.environ.get("LOGGING_LEVEL","info")})

          optional = [
            "STRIPE_SECRET_KEY","STRIPE_MONTHLY_PRICE_ID","STRIPE_WEBHOOK_SECRET",
            "STRIPE_SUCCESS_URL","STRIPE_CANCEL_URL",
            "SENDGRID_API_KEY","SENDGRID_FROM_EMAIL",
            "TWILIO_ACCOUNT_SID","TWILIO_AUTH_TOKEN","TWILIO_PHONE_NUMBER",
            "TWILIO_MAX_CALLS_PER_DAY","TWILIO_DUPLICATE_WINDOW_MIN",
            "META_WHATSAPP_BUSINESS_ID","META_WHATSAPP_PHONE_ID","META_WHATSAPP_TOKEN",
            "WHATSAPP_PHONE_NUMBER_ID","WHATSAPP_TOKEN",
          ]
          for name in optional:
            val = os.environ.get(name, "")
            if val:
              envs.append({"Name": name, "Value": val})

          envs = [e for e in envs if e["Value"]]
          config = {
            "ImageRepository": {
              "ImageIdentifier": f"{repo}:latest",
              "ImageRepositoryType": "ECR",
              "ImageConfiguration": {
                "Port": "8080"
              }
            },
            "Environment": {
              "EnvironmentVariables": envs
            }
          }
          with open("/tmp/source.json", "w", encoding="utf-8") as f:
            json.dump(config, f)
          print("Wrote /tmp/source.json with env vars:", [e["Name"] for e in envs])
          PY
          echo "Updating service $SERVICE_ARN"
          aws apprunner update-service --service-arn "$SERVICE_ARN" --source-configuration file:///tmp/source.json

      - name: Summary
        run: |
          {
            echo "Service: ${{ matrix.name }}"
            echo "Image repo: ${{ steps.img.outputs.repo }}"
            echo "Tags pushed: latest, ${{ steps.tags.outputs.sha_tag }}"
            if [ -z "${{ secrets[matrix.arn_secret] }}" ]; then
              echo "App Runner ARN missing: ${{ matrix.arn_secret }}"
            else
              echo "App Runner deployment triggered for ARN secret: ${{ matrix.arn_secret }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
