# Example NGINX reverse proxy for PlanCraftAI services.
# Replace <service-url> with the service targets you actually deploy.

worker_processes auto;
events { worker_connections 1024; }

http {
  upstream creator_service { server <creator-service-url>; }
  upstream posting_service { server <posting-service-url>; }
  upstream goals_service   { server <goals-service-url>; }
  upstream growth_service  { server <growth-service-url>; }

  server {
    listen 80;

    location /creator-api/ {
      proxy_pass http://creator_service/;
    }
    location /posting-api/ {
      proxy_pass http://posting_service/;
    }
    location /goals-api/ {
      proxy_pass http://goals_service/;
    }
    location /growth-api/ {
      proxy_pass http://growth_service/;
    }

    location / {
      return 404;
    }
  }
}
