gradle.taskGraph.whenReady { taskGraph ->
    def needsReleaseSigning = taskGraph.allTasks.any { task ->
        def taskName = task.name?.toLowerCase() ?: ""
        taskName.contains("release") || taskName.contains("publish")
    }
    if (needsReleaseSigning && !hasReleaseSigning) {
        throw new GradleException(
            "Missing Android release signing configuration. Set ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD via environment variables or mobile/android/keystore.properties."
        )
    }
}

