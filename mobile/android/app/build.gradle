import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def readReleaseConfig = { String key, String fallback = null ->
    if (project.hasProperty(key) && project.property(key)?.toString()?.trim()) {
        return project.property(key).toString().trim()
    }
    def envValue = System.getenv(key)
    if (envValue?.toString()?.trim()) {
        return envValue.toString().trim()
    }
    def fileValue = keystoreProperties.getProperty(key)
    if (fileValue?.toString()?.trim()) {
        return fileValue.toString().trim()
    }
    return fallback
}

def versionFile = rootProject.file("../../version.json")
if (!versionFile.exists()) {
    throw new GradleException("Missing shared version file at ${versionFile}")
}

def versionData = new JsonSlurper().parse(versionFile)
def sharedVersionName = versionData?.version?.toString()?.trim()
if (!sharedVersionName) {
    throw new GradleException("version.json must include a non-empty version field")
}

def androidVersionCode = (readReleaseConfig("ANDROID_VERSION_CODE", "13") as String).toInteger()
def androidVersionName = readReleaseConfig("ANDROID_VERSION_NAME", sharedVersionName)
def releaseStoreFile = readReleaseConfig("ANDROID_KEYSTORE_PATH")
def releaseStorePassword = readReleaseConfig("ANDROID_KEYSTORE_PASSWORD")
def releaseKeyAlias = readReleaseConfig("ANDROID_KEY_ALIAS")
def releaseKeyPassword = readReleaseConfig("ANDROID_KEY_PASSWORD")
def hasReleaseSigning =
        releaseStoreFile &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword

